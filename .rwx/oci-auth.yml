on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: python
    run: |
      sudo apt-get update
      sudo apt-get install -y python3-venv
      sudo apt-get clean
      python3 --version

  - key: oci-cli
    use: python
    run: |
      python3 -m venv "$PWD/.oci-venv"
      "$PWD/.oci-venv/bin/pip" install --quiet --upgrade pip
      "$PWD/.oci-venv/bin/pip" install --quiet 'oci-cli==3.68.0'
      echo "$PWD/.oci-venv/bin" > "$RWX_ENV/PATH"
      "$PWD/.oci-venv/bin/oci" --version

  - key: whoami
    use: oci-cli
    cache: false
    run: |
      umask 077
      mkdir -p "$HOME/.oci"
      printf '%s' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"
      chmod 600 "$HOME/.oci/key.pem"
      export OCI_CLI_KEY_FILE="$HOME/.oci/key.pem"

      echo "--- key sanity ---"
      head -1 "$HOME/.oci/key.pem"
      openssl rsa -in "$HOME/.oci/key.pem" -pubout -outform DER 2>/dev/null \
        | openssl md5 -c | awk '{print "derived fingerprint: " $NF}'
      echo "configured fingerprint: $OCI_CLI_FINGERPRINT"

      echo
      echo "--- region subscriptions ---"
      oci iam region-subscription list --output table

      echo
      echo "--- availability domains in root compartment ---"
      oci iam availability-domain list --compartment-id "$OCI_CLI_TENANCY" --output table

      echo
      echo "--- authenticated user ---"
      oci iam user get --user-id "$OCI_CLI_USER" \
        --query 'data.{name:name,description:description,state:"lifecycle-state"}' --output table
    env:
      OCI_CLI_AUTH: api_key
      OCI_CLI_USER: ${{ vaults.oci-poc.vars.user }}
      OCI_CLI_TENANCY: ${{ vaults.oci-poc.vars.tenancy }}
      OCI_CLI_FINGERPRINT: ${{ vaults.oci-poc.vars.fingerprint }}
      OCI_CLI_REGION: ${{ vaults.oci-poc.vars.region }}
      OCI_PRIVATE_KEY:
        value: ${{ vaults.oci-poc.secrets.private-key }}
        cache-key: excluded

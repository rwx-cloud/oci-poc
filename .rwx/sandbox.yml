# Interactive cloud sandbox with the OCI CLI + SDK and this repo's credentials
# already wired up, for poking at the tenancy without running a full benchmark.
#
#   rwx sandbox exec -- oci compute shape list --compartment-id "$OCI_CLI_TENANCY" --output table
#   rwx sandbox exec -- python script/oci_sweep.py --all-runs

on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.1.0
    with:
      preserve-git-dir: true
      repository: https://github.com/rwx-cloud/oci-poc.git
      ref: ${{ init.commit-sha }}
      github-token: ${{ github['rwx-cloud'].token }}

  - key: python
    run: |
      sudo apt-get update
      sudo apt-get install -y python3-venv
      sudo apt-get clean
      python3 --version

  # Installed outside the workspace on purpose: `rwx sandbox exec` syncs the
  # workspace both ways, and a venv sitting in it gets clobbered by the sync.
  - key: oci-sdk
    use: python
    run: |
      sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/oci-venv
      python3 -m venv /opt/oci-venv
      /opt/oci-venv/bin/pip install --quiet --upgrade pip
      /opt/oci-venv/bin/pip install --quiet 'oci-cli==3.68.0'
      echo /opt/oci-venv/bin > "$RWX_ENV/PATH"
      /opt/oci-venv/bin/oci --version

  - key: sandbox
    use: [code, oci-sdk]
    run: |
      umask 077
      # Deterministic path outside the workspace so `rwx sandbox exec` picks it
      # up from OCI_CLI_KEY_FILE below without depending on $HOME or $PWD.
      sudo install -d -o "$(id -u)" -g "$(id -g)" -m 700 /opt/oci
      printf '%s' "$OCI_PRIVATE_KEY" > /opt/oci/key.pem
      chmod 600 /opt/oci/key.pem
      rwx-sandbox
    env:
      OCI_CLI_KEY_FILE: /opt/oci/key.pem
      OCI_CLI_AUTH: api_key
      OCI_CLI_USER: ${{ vaults.oci-poc.vars.user }}
      OCI_CLI_TENANCY: ${{ vaults.oci-poc.vars.tenancy }}
      OCI_CLI_FINGERPRINT: ${{ vaults.oci-poc.vars.fingerprint }}
      OCI_CLI_REGION: ${{ vaults.oci-poc.vars.region }}
      OCI_PRIVATE_KEY:
        value: ${{ vaults.oci-poc.secrets.private-key }}
        cache-key: excluded
